<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Navbar Scroll Effect</title>

<style>
    body{
        margin:0;
        font-family: Arial, Helvetica, sans-serif;
        height:2000px; /* Just for scroll demo */
    }

    nav{
        position: fixed;
        top:0;
        left:0;
        width:100%;
        display:flex;
        align-items:center;
        justify-content:space-between;
        padding:20px 60px;
        background:transparent;
        transition: all 0.3s ease;
        z-index:1000;
    }

    nav.scrolled{
        background:#ffffff;
        box-shadow:0 4px 10px rgba(0,0,0,0.05);
    }

    nav ul{
        display:flex;
        list-style:none;
        gap:30px;
        margin:0;
        padding:0;
    }

    nav ul li{
        color:#ffffff;
        cursor:pointer;
        font-weight:500;
        transition: color 0.3s ease;
    }

    nav.scrolled ul li{
        color:#333333;
    }

    nav img{
        height:25px;
        width:auto;
    }
</style>
</head>

<body>

<nav id="navbar">
    <img src="{{ asset('images/icon/esokhari.png')}}" alt="esokhari-logo">

    <ul>
        <li>Home</li>
        <li>Portfolio</li>
        <li>Service</li>
        <li>Contact</li>
        <li>Booking</li>
    </ul>

    <div></div>
</nav>

<script>
    const navbar = document.getElementById("navbar");

    window.addEventListener("scroll", function() {
        if (window.scrollY > 0) {
            navbar.classList.add("scrolled");
        } else {
            navbar.classList.remove("scrolled");
        }
    });
</script>

</body>
</html>
